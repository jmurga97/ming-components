name: Dev publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-publish-${{ github.ref }}

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@jmurga97'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Lint, typecheck and test
        run: bun run lint && bun run check && bun run test

      - name: Build and verify package
        run: bun run package:check

      - name: Apply dev version and scope
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sha = process.env.GITHUB_SHA.slice(0, 7);
          pkg.name = '@jmurga97/components';
          pkg.version = `${pkg.version}-dev.${process.env.GITHUB_RUN_NUMBER}.${sha}`;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Publish dev build to GitHub Packages
        run: npm publish --ignore-scripts --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
